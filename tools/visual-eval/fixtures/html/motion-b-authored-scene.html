<!-- (b) An authored HyperFrames scene: every motion is a CSS animation with a real duration
     and delay (so the renderer's seek pins it), the brand is the deck's (ink #0F1E26, teal
     #0E7C7B/#3FC1B8, Helvetica Neue), and the timeline is written in seconds:
       0.0-1.1  a drop falls to the waterline          (ease-in, gravity)
       1.0-2.6  three rings spread from the impact      (staggered 0.25 s, fade as they grow)
       1.5-2.5  "Tidewell" rises out of the water       (opacity + 18px + tracking settles)
       2.5-3.3  the tagline wipes on left to right      (clip-path)
       3.3-6.0  hold — one slow ring keeps breathing so the held frame is alive
     The last frame is the lock-up the card settles to (the poster should be taken there). -->
<div class="stage">
  <div class="line"></div>
  <div class="drop"></div>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
  <div class="word">Tidewell</div>
  <div class="tag">Stop leaks before they start.</div>
</div>
<style>
  body { background:#0F1E26 !important; }
  .stage { position:absolute; inset:0; background:radial-gradient(80% 70% at 50% 62%, #12303A 0%, #0F1E26 70%); overflow:hidden;
           font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .line { position:absolute; left:50%; top:430px; width:0; height:2px; background:#1E4B53; transform:translateX(-50%);
          animation: line 1.4s cubic-bezier(.2,.8,.2,1) .9s both; }
  .drop { position:absolute; left:50%; top:0; width:22px; height:30px; margin-left:-11px; background:#3FC1B8;
          border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
          animation: fall 1.1s cubic-bezier(.55,0,1,.45) 0s both, vanish .12s linear 1.1s both; }
  .ring { position:absolute; left:50%; top:430px; width:360px; height:72px; margin:-36px 0 0 -180px; border-radius:50%;
          border:2px solid #3FC1B8; opacity:0; }
  .r1 { animation: ripple 1.6s cubic-bezier(.1,.6,.3,1) 1.05s both; }
  .r2 { animation: ripple 1.6s cubic-bezier(.1,.6,.3,1) 1.30s both; }
  .r3 { animation: ripple 1.6s cubic-bezier(.1,.6,.3,1) 1.55s both; }
  .r4 { animation: breathe 2.7s ease-in-out 3.3s both; }
  .word { position:absolute; left:0; right:0; top:250px; text-align:center; color:#FFFFFF; font-size:132px; font-weight:700;
          line-height:1; animation: rise 1.0s cubic-bezier(.2,.8,.2,1) 1.5s both; }
  .tag { position:absolute; left:0; right:0; top:470px; text-align:center; color:#9FD9D3; font-size:34px; font-weight:400;
         animation: wipe .8s cubic-bezier(.6,0,.2,1) 2.5s both; }
  @keyframes fall   { from { transform:translateY(-40px); } to { transform:translateY(400px); } }
  @keyframes vanish { from { opacity:1; } to { opacity:0; } }
  @keyframes line   { from { width:0; } to { width:880px; } }
  @keyframes ripple { 0% { opacity:0; transform:scale(.05); } 12% { opacity:.9; } 100% { opacity:0; transform:scale(1.6); } }
  @keyframes breathe{ 0% { opacity:0; transform:scale(.3); } 50% { opacity:.35; } 100% { opacity:0; transform:scale(1.25); } }
  @keyframes rise   { from { opacity:0; transform:translateY(18px); letter-spacing:.02em; } to { opacity:1; transform:translateY(0); letter-spacing:-.035em; } }
  @keyframes wipe   { from { clip-path:inset(0 100% 0 0); opacity:.2; } to { clip-path:inset(0 0 0 0); opacity:1; } }
</style>
