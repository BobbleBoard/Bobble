<!doctype html>
<!--
  Mac computer-use cursor overlay — the ONLY thing the user perceives while Pi
  drives an app in the background: a phantom gradient cursor + a status bubble
  floating over the controlled window. Hosted by a transparent, click-through,
  always-on-top BrowserWindow (see overlay-window.ts) positioned exactly over
  the controlled app's window; the window chrome itself must never be seen.

  Deliberately a STATIC file (plain JS/CSS, loaded via loadFile) so it has zero
  coupling to the vite build. The main process drives it by calling
  window.__pdOverlay(msg) via executeJavaScript; every message is defensive —
  a malformed one is ignored rather than thrown.

  The cursor artwork is the shared Pi agent cursor: keep the SVG in sync with
  apps/desktop/electron/canvas/agent-cursor.ts (the browser-use cursor uses the
  same glyph — one visual identity for "Pi is driving").

  THE BUBBLE IS THE ONLY CONTROL THE USER HAS while an app is driven in the
  background, so it is the one part of this window that is NOT click-through:
  hovering it asks main to catch the mouse (setIgnoreMouseEvents(false)), the ✕
  stops the run, and the body brings Bobble forward. The page has no preload and
  no ipcRenderer — it speaks by opening a `pd-overlay:<verb>` URL, which
  overlay-window.ts's window-open handler reads and denies.

  ITS COLOURS ARE PUSHED IN, not written here: main sends { kind:'theme' } with
  the accent of whichever flavour is on, so the phantom on screen and the
  phantom in the canvas tab are the same object. (The pill stays near-black in
  both themes — it floats over the user's desktop, which is neither.)
-->
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* ── the phantom cursor ─────────────────────────────────────────────── */
  /* The wrap carries position (transform) + travel animation; the svg carries
     the press dip so the two transforms never fight. Spring-ish ease with a
     slight overshoot — the cursor GLIDES, never teleports. */
  #cursor-wrap {
    position: absolute;
    left: 0;
    top: 0;
    will-change: transform;
    transform: translate3d(-200px, -200px, 0);
    transition: transform var(--travel, 300ms) cubic-bezier(0.22, 0.9, 0.32, 1.1);
    opacity: 0;
  }
  #cursor-wrap.on {
    opacity: 1;
  }
  #cursor-wrap.appear {
    transition:
      transform var(--travel, 300ms) cubic-bezier(0.22, 0.9, 0.32, 1.1),
      opacity 0.35s ease-out;
  }
  #cursor {
    display: block;
    /* The pointing TIP (top-left point) sits at ~(8.5%,5.2%) of the 34×31 box →
       negative margin so the wrap's translate() means "tip at this point". */
    margin: -1.6px 0 0 -2.9px;
    filter: drop-shadow(0 1px 2px rgba(10, 12, 40, 0.42))
      drop-shadow(0 0 4px rgba(214, 226, 255, 0.9))
      drop-shadow(0 0 11px rgba(120, 165, 255, 0.55));
    transform-origin: 8.5% 5.2%;
    transition: transform 0.15s ease-out;
  }
  /* Click "pop": a tiny shrink then grow, radiating from the tip (the user). */
  #cursor.press {
    animation: cursor-pop 0.34s cubic-bezier(0.3, 0.7, 0.3, 1.25);
  }
  @keyframes cursor-pop {
    0% {
      transform: scale(1);
    }
    38% {
      transform: scale(0.82);
    }
    70% {
      transform: scale(1.09);
    }
    100% {
      transform: scale(1);
    }
  }

  /* ── the status bubble (rides the cursor) ───────────────────────────── */
  #bubble {
    position: absolute;
    left: 27px;
    top: 40px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 8px 7px 13px;
    border-radius: 999px;
    font:
      600 12.5px/1.2 -apple-system,
      system-ui,
      sans-serif;
    letter-spacing: 0.01em;
    color: var(--ink, #fff);
    /* The canvas bubble's treatment, shared (see the header): a near-black
       pill with the theme accent as its ring, rather than a second palette. */
    background: var(--pill, rgba(22, 24, 30, 0.92));
    border: 1.5px solid color-mix(in srgb, var(--accent, #0071e3) 55%, transparent);
    box-shadow:
      0 4px 18px rgba(8, 10, 22, 0.46),
      0 0 26px color-mix(in srgb, var(--accent, #0071e3) 24%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    white-space: nowrap;
    /* Never wider than the window it has to sit inside. */
    max-width: min(340px, calc(100vw - 16px));
    opacity: 0;
    transform: translateY(5px) scale(0.9);
    transform-origin: top left;
    transition:
      opacity 0.22s ease,
      transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    /* The one hit-testable thing in the window (main gates the OS-level
       click-through; this is only about which element gets the event). */
    pointer-events: auto;
  }
  /* The brake. Small, quiet, and always in the same place — the promise is
     that it is there, not that it is loud. */
  #bstop {
    flex: none;
    width: 19px;
    height: 19px;
    margin-left: 1px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: var(--ink, #fff);
    font: 600 11px/1 -apple-system, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.72;
    cursor: default;
    pointer-events: auto;
    transition:
      opacity 0.15s ease,
      background 0.15s ease;
  }
  #bstop:hover {
    opacity: 1;
    background: rgba(255, 90, 80, 0.9);
  }
  #bubble.show {
    opacity: 1;
    transform: none;
  }
  /* Which corner the pill grows from — POSITION is set inline by placeBubble(),
     which clamps it into the window. These used to set `right: 14px`, and since
     the pill is positioned inside a zero-width cursor wrapper that mirrored it
     to the LEFT of the cursor with nothing checking it fit there. the user caught it
     on a live run: near a narrow window's left edge the pill was sheared off
     mid-word. A flip alone cannot fix that — it just chooses which edge to
     overflow — so the flip is now only the animation's origin. */
  #bubble.flip-x {
    transform-origin: top right;
  }
  #bubble.flip-y {
    transform-origin: bottom left;
  }
  #bubble.flip-x.flip-y {
    transform-origin: bottom right;
  }
  /* Gentle breathing while thinking. */
  #bubble.pulse {
    animation: bubble-breathe 2.1s ease-in-out infinite;
  }
  @keyframes bubble-breathe {
    0%,
    100% {
      box-shadow:
        0 4px 18px rgba(8, 10, 22, 0.46),
        0 0 22px color-mix(in srgb, var(--accent, #0071e3) 20%, transparent),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
    50% {
      box-shadow:
        0 4px 20px rgba(8, 10, 22, 0.5),
        0 0 34px color-mix(in srgb, var(--accent, #0071e3) 38%, transparent),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
  }

  /* The label yields, the brake does not: with `nowrap` and no `min-width: 0`
     a long typing preview overflows the pill and pushes the ✕ off the end —
     which is the one thing in this window that must always be reachable. */
  #btext {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #btext em {
    font-style: normal;
    opacity: 0.78;
    font-weight: 500;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11.5px;
  }

  /* Animated thinking/typing dots. */
  #bdots {
    display: none;
    align-items: center;
    gap: 3px;
  }
  #bdots.on {
    display: inline-flex;
  }
  #bdots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.5;
    animation: dot-wave 1.25s ease-in-out infinite;
  }
  #bdots span:nth-child(2) {
    animation-delay: 0.16s;
  }
  #bdots span:nth-child(3) {
    animation-delay: 0.32s;
  }
  @keyframes dot-wave {
    0%,
    60%,
    100% {
      opacity: 0.45;
      transform: translateY(0);
    }
    30% {
      opacity: 1;
      transform: translateY(-2.5px);
    }
  }

  /* ── click ripple ───────────────────────────────────────────────────── */
  .ripple {
    position: absolute;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    border: 2.5px solid rgba(96, 152, 255, 0.95);
    box-shadow:
      0 0 14px rgba(79, 145, 255, 0.65),
      inset 0 0 8px rgba(63, 130, 242, 0.4);
    opacity: 0.95;
    transform: scale(0.55);
  }
  .ripple.go {
    transition:
      transform 0.5s cubic-bezier(0.16, 0.84, 0.44, 1),
      opacity 0.5s ease-out;
    transform: scale(3.1);
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    #cursor-wrap,
    #cursor-wrap.appear,
    #bubble,
    #bubble.show,
    #cursor {
      transition: none;
    }
    #bubble.pulse,
    #bdots span,
    #cursor.press {
      animation: none;
    }
  }
</style>

<div id="stage">
  <div id="cursor-wrap">
    <!-- SYNC: apps/desktop/electron/canvas/agent-cursor.ts (AGENT_CURSOR_PATH) -->
    <svg id="cursor" aria-hidden="true" width="34" height="31" viewBox="8.14 8.24 26.56 24.21" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="pi-cur-body" x1="10" y1="9" x2="30" y2="30" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.97" />
          <stop offset="0.45" stop-color="#e6ecf6" stop-opacity="0.9" />
          <stop offset="1" stop-color="#c2cfe4" stop-opacity="0.86" />
        </linearGradient>
        <linearGradient id="pi-cur-sheen" x1="10" y1="9" x2="22" y2="23" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
      </defs>
      <!-- Frosted send-dart: pearl/lavender body + top-left sheen + a thin bright
           keyline. The luminous rim glow lives on #cursor's CSS drop-shadow, not
           here, so the glyph stays crisp (matches the user's reference cursor). -->
      <path
        d="M 10.01 13.12 Q 8.00 8.00 13.04 10.21 L 30.55 17.89 Q 36.50 20.50 30.03 21.17 L 25.48 21.64 Q 22.00 22.00 20.85 25.31 L 19.64 28.78 Q 18.00 33.50 16.17 28.85 Z"
        fill="url(#pi-cur-body)"
        stroke="#ffffff"
        stroke-opacity="0.85"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <path
        d="M 10.01 13.12 Q 8.00 8.00 13.04 10.21 L 30.55 17.89 Q 36.50 20.50 30.03 21.17 L 25.48 21.64 Q 22.00 22.00 20.85 25.31 L 19.64 28.78 Q 18.00 33.50 16.17 28.85 Z"
        fill="url(#pi-cur-sheen)"
        opacity="0.6"
      />
    </svg>
    <div id="bubble">
      <span id="bdots"><span></span><span></span><span></span></span>
      <span id="btext">Thinking</span>
      <button id="bstop" type="button" title="Stop" aria-label="Stop">✕</button>
    </div>
  </div>
</div>

<script>
  (() => {
    'use strict';
    var stage = document.getElementById('stage');
    var wrap = document.getElementById('cursor-wrap');
    var cursor = document.getElementById('cursor');
    var bubble = document.getElementById('bubble');
    var bdots = document.getElementById('bdots');
    var btext = document.getElementById('btext');
    var bstop = document.getElementById('bstop');
    var reduce = false;
    try {
      reduce = !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
    } catch {
      /* media queries unavailable */
    }

    var cx = -1;
    var cy = -1; // local cursor position (-1 = never placed)
    var placed = false;

    /* ── the page's one way to speak ────────────────────────────────────────
       No preload, no ipcRenderer (deliberately — see the header). A
       `pd-overlay:<verb>` window.open is read and DENIED by
       overlay-window.ts's window-open handler, so it never navigates and
       never opens anything; the URL is the whole message. */
    function say(verb) {
      try {
        window.open(`pd-overlay:${verb}`, '_blank');
      } catch {
        /* the overlay is cosmetic — a failed signal must break nothing */
      }
    }

    /* Hovering the bubble is what asks main to stop being click-through, and
       leaving it is what gives the mouse back. `forward: true` on
       setIgnoreMouseEvents is what makes these fire at all while the window is
       still transparent to the mouse.
       The repeat is not belt-and-braces: main drops the catch on a watchdog, so
       that a missed 'mouseleave' can never leave a transparent window
       swallowing the user's clicks — which makes the hold a DEAD MAN'S SWITCH,
       and a pointer resting on the bubble has to keep pressing it or the ✕
       stops working after a few seconds of hovering. */
    var hitBeat = 0;
    bubble.addEventListener('mouseenter', () => {
      say('hit');
      if (hitBeat === 0) hitBeat = setInterval(() => say('hit'), 1500);
    });
    bubble.addEventListener('mouseleave', () => {
      if (hitBeat !== 0) {
        clearInterval(hitBeat);
        hitBeat = 0;
      }
      say('unhit');
    });
    bstop.addEventListener('click', (e) => {
      e.stopPropagation();
      say('stop');
    });
    bubble.addEventListener('click', () => say('reveal'));

    function setCursor(x, y, ms) {
      cx = x;
      cy = y;
      var travel = reduce ? 0 : typeof ms === 'number' ? ms : 300;
      wrap.style.setProperty('--travel', `${travel}ms`);
      wrap.style.transform = `translate3d(${x}px,${y}px,0)`;
      placeBubble();
    }

    /* Keep the pill wholly inside the window: prefer below-right of the cursor,
       mirror it when that overflows, and CLAMP either way.

       Mirroring alone was the bug. The pill lives inside the zero-width cursor
       wrapper, so `right: 14px` put its right edge at the cursor and its left
       edge wherever its width landed — off the window, near a narrow window's
       left edge. MEASURED by the user watching a live run: "ensure no cut off on
       window". Clamping is what makes it true for every window width, every
       cursor position and every pill length. */
    function placeBubble() {
      // Guard against a not-yet-laid-out viewport (0×0 would force both flips).
      if (window.innerWidth < 40 || window.innerHeight < 40) return;
      var bw = bubble.offsetWidth || 140;
      var bh = bubble.offsetHeight || 34;
      var m = 8;
      var maxLeft = Math.max(m, window.innerWidth - bw - m);
      var maxTop = Math.max(m, window.innerHeight - bh - m);
      var wantLeft = cx + 27;
      if (wantLeft > maxLeft) wantLeft = cx - 14 - bw;
      var wantTop = cy + 40;
      if (wantTop > maxTop) wantTop = cy - 10 - bh;
      var left = Math.max(m, Math.min(maxLeft, wantLeft));
      var top = Math.max(m, Math.min(maxTop, wantTop));
      // Inline offsets are relative to the cursor wrapper the pill sits in.
      bubble.style.left = `${left - cx}px`;
      bubble.style.top = `${top - cy}px`;
      // The classes now only choose which corner the pill grows from.
      bubble.classList.toggle('flip-x', left < cx);
      bubble.classList.toggle('flip-y', top < cy);
    }
    window.addEventListener('resize', placeBubble);

    function ensurePlaced() {
      if (placed) return;
      placed = true;
      wrap.classList.add('appear');
      setCursor(
        cx >= 0 ? cx : Math.round(window.innerWidth / 2),
        cy >= 0 ? cy : Math.round(window.innerHeight / 2),
        0
      );
      requestAnimationFrame(() => {
        wrap.classList.add('on');
      });
    }

    function showBubble(text, opts) {
      opts = opts || {};
      btext.innerHTML = '';
      btext.appendChild(document.createTextNode(text));
      if (opts.sub) {
        const em = document.createElement('em');
        em.textContent = ` ${opts.sub}`;
        btext.appendChild(em);
      }
      bdots.classList.toggle('on', !!opts.dots);
      bubble.classList.toggle('pulse', !!opts.pulse && !reduce);
      bubble.classList.add('show');
      placeBubble();
    }

    function ripple(x, y, delay) {
      setTimeout(() => {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = `${x}px`;
        r.style.top = `${y}px`;
        stage.appendChild(r);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            r.classList.add('go');
          });
        });
        setTimeout(() => {
          r.remove();
        }, 620);
      }, delay || 0);
    }

    function press() {
      // Restart the keyframe each click (remove → reflow → add).
      cursor.classList.remove('press');
      void cursor.offsetWidth;
      cursor.classList.add('press');
      setTimeout(() => {
        cursor.classList.remove('press');
      }, 360);
    }

    /* ── "thinking" is the one state with no natural end ────────────────────
       Every other bubble state is followed by an act; this one can sit there
       while a model works, and three dots look identical at 2s and at 90s.
       After STILL_THINKING_MS it starts counting, so a slow turn and a stuck
       one stop looking the same. Timed in the page: no per-second round-trip
       to main, and it stops the moment any other status arrives.

       DELIBERATELY BELOW overlay-window.ts's BUBBLE_IDLE_MS (15s), which is
       the point at which the bubble fades because nothing has happened and the
       overlay can no longer honestly claim the model is thinking. A counter
       that started after the fade could never be seen. The canvas tab keeps
       counting past it — main publishes `thinkingMs` for exactly that — because
       the tab is where the user goes to ask "is this stuck?". */
    var STILL_THINKING_MS = 8_000;
    var thinkingSince = 0;
    var thinkingTimer = 0;

    function stopThinkingClock() {
      if (thinkingTimer !== 0) {
        clearInterval(thinkingTimer);
        thinkingTimer = 0;
      }
      thinkingSince = 0;
    }

    function tickThinking() {
      if (thinkingSince === 0) return;
      var elapsed = Date.now() - thinkingSince;
      if (elapsed < STILL_THINKING_MS) return;
      showBubble('Still thinking', { dots: true, pulse: true, sub: `${Math.round(elapsed / 1000)}s` });
    }

    function startThinkingClock() {
      if (thinkingSince !== 0) return; // an unbroken think keeps its clock
      thinkingSince = Date.now();
      thinkingTimer = setInterval(tickThinking, 1000);
    }

    var STATUS = {
      opening: (msg) => {
        showBubble(msg.text || 'Opening', { dots: true });
      },
      thinking: () => {
        showBubble('Thinking', { dots: true, pulse: true });
        startThinkingClock();
      },
      clicking: () => {
        showBubble('Clicking', {});
      },
      typing: (msg) => {
        showBubble('Typing', { dots: true, sub: msg.text || '' });
      },
      pressing: (msg) => {
        showBubble(`Pressing ${msg.text || ''}`, {});
      },
      scrolling: () => {
        showBubble('Scrolling', { dots: true });
      },
      reading: () => {
        showBubble('Reading the screen', { dots: true });
      },
    };

    /* Colours are the app's, not this file's — one phantom, one palette. */
    function setTheme(msg) {
      var root = document.documentElement.style;
      if (typeof msg.accent === 'string') root.setProperty('--accent', msg.accent);
      if (typeof msg.pill === 'string') root.setProperty('--pill', msg.pill);
      if (typeof msg.ink === 'string') root.setProperty('--ink', msg.ink);
    }

    function handle(msg) {
      if (!msg || typeof msg !== 'object') return;
      if (msg.kind === 'theme') {
        setTheme(msg);
        return;
      }
      if (msg.kind === 'reset') {
        // Window shown / resized: make sure the cursor is inside the view.
        ensurePlaced();
        if (cx > window.innerWidth - 4 || cy > window.innerHeight - 4) {
          setCursor(
            Math.min(cx, Math.max(4, window.innerWidth - 8)),
            Math.min(cy, Math.max(4, window.innerHeight - 8)),
            0
          );
        }
        return;
      }
      if (msg.kind === 'cursor') {
        ensurePlaced();
        setCursor(msg.x, msg.y, msg.ms);
        return;
      }
      if (msg.kind === 'click') {
        ensurePlaced();
        stopThinkingClock();
        setCursor(msg.x, msg.y, 0);
        press();
        showBubble('Clicking', {});
        ripple(msg.x, msg.y, 0);
        if (!reduce) ripple(msg.x, msg.y, 130);
        return;
      }
      if (msg.kind === 'status') {
        ensurePlaced();
        if (msg.status !== 'thinking') stopThinkingClock();
        const fn = STATUS[msg.status];
        if (fn) fn(msg);
        return;
      }
      if (msg.kind === 'hide-bubble') {
        stopThinkingClock();
        bubble.classList.remove('show', 'pulse');
        return;
      }
    }

    window.__pdOverlay = (msg) => {
      try {
        handle(msg);
      } catch {
        /* a bad message must never break the overlay */
      }
      return true;
    };
  })();
</script>
