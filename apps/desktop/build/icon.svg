<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE DOCK ICON: THE THREE TILES, NOTHING ELSE.

  the user: "the app dock image shouldn't be there just the three squares."

  The previous icon was the tiles sitting on a dark gradient squircle with rim
  lighting — a plate. Free of it, the tiles are the mark, so they are drawn at
  the scale the plate used to occupy rather than left rattling around inside a
  square of empty space: the cluster spans 88..936 of the 1024 canvas.

  Rendered onto TRANSPARENT by scripts/gen-icon.sh, which fails the build if the
  corner alpha comes back opaque — that was the white-ring bug.

  Each tile keeps a soft inner top-light and a drop shadow so the mark reads as
  three objects rather than three flat swatches at 32px in the Dock. Colours and
  arrangement match src/chat/BobbleMark.tsx exactly (teal top-right, amber
  bottom-left, pink bottom-right); the two must stay in step, or the thing in the
  Dock and the thing in the sidebar stop being the same mark.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3ED8D3"/>
      <stop offset="1" stop-color="#08A8AE"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFD44F"/>
      <stop offset="1" stop-color="#F0AE13"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF63B4"/>
      <stop offset="1" stop-color="#E52288"/>
    </linearGradient>
    <!-- A single soft shadow under the cluster: enough to lift the tiles off a
         light Dock, not enough to read as a plate. -->
    <filter id="lift" x="-12%" y="-12%" width="128%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A1020" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <g filter="url(#lift)">
    <!-- top-right -->
    <rect x="536" y="88" width="400" height="400" rx="112" fill="url(#teal)"/>
    <rect x="536" y="88" width="400" height="400" rx="112" fill="url(#sheen)"/>
    <!-- bottom-left -->
    <rect x="88" y="536" width="400" height="400" rx="112" fill="url(#amber)"/>
    <rect x="88" y="536" width="400" height="400" rx="112" fill="url(#sheen)"/>
    <!-- bottom-right -->
    <rect x="536" y="536" width="400" height="400" rx="112" fill="url(#pink)"/>
    <rect x="536" y="536" width="400" height="400" rx="112" fill="url(#sheen)"/>
  </g>
</svg>
