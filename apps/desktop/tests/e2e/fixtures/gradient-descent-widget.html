<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gradient descent</title>
<style>
  :root { color-scheme: light dark; --ink: #1d1d1f; --mute: #6e6e73; --line: #d2d2d7; --accent: #0071e3; --paper: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --mute: #a1a1a6; --line: #3a3a3c; --accent: #0a84ff; --paper: #1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 18px 18px; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  p { margin: 0 0 12px; color: var(--mute); font-size: 13px; }
  canvas { width: 100%; height: 220px; display: block; border: 1px solid var(--line); border-radius: 10px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  label { color: var(--mute); font-size: 13px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stat { font-variant-numeric: tabular-nums; min-width: 12ch; text-align: right; }
</style>
</head>
<body>
<h1>Gradient descent on f(x) = x²</h1>
<p>Each step moves against the slope: x ← x − η·f′(x). Too large a step overshoots.</p>
<canvas id="plot" width="960" height="440"></canvas>
<div class="row">
  <label for="lr">Learning rate η</label>
  <input id="lr" type="range" min="0.02" max="1.05" step="0.01" value="0.25">
  <span id="lrv" class="stat">0.25</span>
</div>
<div class="row">
  <button id="step" class="primary">Step</button>
  <button id="reset">Reset</button>
  <span id="state" class="stat" style="margin-left:auto">step 0 · x = 1.80</span>
</div>
<script>
  const cv = document.getElementById('plot');
  const g = cv.getContext('2d');
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let x = 1.8, steps = 0, trail = [1.8];
  const X = (v) => (v + 2.2) / 4.4 * cv.width;
  const Y = (v) => cv.height - 30 - v / 4.9 * (cv.height - 60);
  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.lineWidth = 3; g.strokeStyle = css('--line'); g.beginPath();
    for (let i = 0; i <= 200; i++) { const v = -2.2 + 4.4 * i / 200; i ? g.lineTo(X(v), Y(v * v)) : g.moveTo(X(v), Y(v * v)); }
    g.stroke();
    g.strokeStyle = css('--accent'); g.lineWidth = 2; g.setLineDash([6, 6]); g.beginPath();
    trail.forEach((v, i) => (i ? g.lineTo(X(v), Y(v * v)) : g.moveTo(X(v), Y(v * v)))); g.stroke(); g.setLineDash([]);
    trail.forEach((v, i) => { g.fillStyle = i === trail.length - 1 ? css('--accent') : css('--mute'); g.beginPath(); g.arc(X(v), Y(v * v), i === trail.length - 1 ? 9 : 5, 0, Math.PI * 2); g.fill(); });
  }
  const lr = document.getElementById('lr');
  const say = () => { document.getElementById('state').textContent = 'step ' + steps + ' · x = ' + x.toFixed(2); document.getElementById('lrv').textContent = Number(lr.value).toFixed(2); };
  document.getElementById('step').onclick = () => { x = x - Number(lr.value) * 2 * x; steps++; trail.push(Math.max(-2.2, Math.min(2.2, x))); say(); draw(); };
  document.getElementById('reset').onclick = () => { x = 1.8; steps = 0; trail = [1.8]; say(); draw(); };
  lr.oninput = say;
  say(); draw();
</script>
</body>
</html>
