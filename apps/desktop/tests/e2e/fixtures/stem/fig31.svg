<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fff"/>
  <!-- right face, shaded -->
  <polygon points="325,85 415,18 415,188 325,253" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <!-- front face -->
  <rect x="157" y="85" width="168" height="168" fill="none" stroke="#111" stroke-width="2"/>
  <!-- top face -->
  <polyline points="157,85 247,18 415,18" fill="none" stroke="#111" stroke-width="2"/>
  <!-- hidden edges -->
  <g stroke="#111" stroke-width="1.6" stroke-dasharray="6 5" fill="none">
    <line x1="247" y1="18" x2="247" y2="188"/>
    <line x1="247" y1="188" x2="415" y2="188"/>
    <line x1="247" y1="188" x2="157" y2="253"/>
  </g>
  <!-- molecule and its velocity -->
  <circle cx="236" cy="163" r="6" fill="#111"/>
  <line x1="243" y1="163" x2="290" y2="163" stroke="#111" stroke-width="2" marker-end="url(#head)"/>
  <text x="255" y="152" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="18">u</text>
  <line x1="98" y1="112" x2="232" y2="160" stroke="#111" stroke-width="1.2"/>
  <text x="18" y="112" font-family="Helvetica, Arial, sans-serif" font-size="17">molecule</text>
  <!-- dimension L -->
  <g stroke="#111" stroke-width="1.2" stroke-dasharray="5 4">
    <line x1="415" y1="18" x2="495" y2="18"/>
    <line x1="415" y1="188" x2="495" y2="188"/>
  </g>
  <line x1="482" y1="24" x2="482" y2="182" stroke="#111" stroke-width="1.4" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="492" y="110" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="18">L</text>
  <text x="228" y="315" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="15">Fig. 3.1</text>
</svg>
