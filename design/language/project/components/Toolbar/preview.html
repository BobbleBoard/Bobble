<!-- @dsCard group="Anatomy" height=320 subtitle="The glass bar over something made: icon buttons, one named action, your cursor on it" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar</title>
<style>
  body { margin: 0; background: var(--ground); color: var(--ink); }
  .stage { position: relative; margin: 28px 32px; height: 200px; border-radius: var(--radius-lg); background: var(--sun-tint); overflow: hidden; }
  .stage .bb-picture { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto; }
  .bar { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: var(--radius-full); background: var(--overlay); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 0 0 1px var(--edge), var(--shadow-popover); }
  .ib { width: 32px; height: 32px; border-radius: var(--radius-full); display: grid; place-items: center; color: var(--ink-secondary); }
  .ib svg { width: 16px; height: 16px; }
  .ib.hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .sep { width: 1px; height: 18px; margin: 0 4px; background: var(--edge); }
  .primary { height: 32px; padding: 0 14px 0 12px; border-radius: var(--radius-full); background: var(--ink); color: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
  .primary svg { width: 15px; height: 15px; }
  .bb-cursor { left: 321px; top: 47px; }
  .notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 0 32px; color: var(--ink-secondary); }
  .notes b { color: var(--ink); font-weight: 600; }
  .notes p { margin: 0; }
</style>
</head>
<body>
<div class="bb-scene bb-hue-sun">
  <div class="stage">
    <span class="bb-picture" aria-hidden="true"><svg viewBox="0 0 696 200" preserveAspectRatio="xMidYMax slice"><circle class="sun" cx="560" cy="70" r="22"/><rect class="hill-back" x="380" y="140" width="190" height="190" rx="53" transform="rotate(45 475 235)"/><rect class="hill" x="140" y="120" width="230" height="230" rx="64" transform="rotate(45 255 235)"/></svg></span>
    <div class="bar">
      <span class="ib"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 2.3 13.7 5.4 6.2 12.9 3.1 9.8z"></path><path d="M8.9 4 12 7.1"></path><path d="M3.1 9.8 2.1 13.9l4.1-1z"></path></svg></span><span class="ib"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="7" height="7" rx="1.5"></rect><path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"></path></svg></span><span class="ib hover"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M4.5 7L8 10.5 11.5 7M3 12.5h10"></path></svg></span><span class="ib"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.6" cy="8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="12.4" cy="8" r="1.1" fill="currentColor" stroke="none"></circle></svg></span>
      <span class="sep"></span>
      <span class="primary label"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2.6M5.3 5.3 8 2.6l2.7 2.7"></path><path d="M4 8.5v4a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-4"></path></svg> Share</span>
    </div>
    <span class="bb-cursor"><svg width="22.14" height="25.30" viewBox="49.499 49.514 191.719 219.132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><filter id="pi-cur-shadow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27.72"/></filter></defs><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="rgba(13, 15, 33, 0.3)" transform="translate(0 12.13)" filter="url(#pi-cur-shadow)"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="#0a0b0f" stroke="#ffffff" stroke-width="13.79" stroke-linejoin="round"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="none" stroke="#ffffff" stroke-width="4.69" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="notes body">
    <p><b>Glass over the work</b>, centred at its top: overlay, edge, shadow-popover.</p>
    <p><b>Icons from the set</b>, 16 in a 32 target, ink-secondary; hovered, ink on an 8% wash.</p>
    <p><b>One named action</b> in ink, last. Everything else is an icon.</p>
  </div>
</div>
</body>
</html>
