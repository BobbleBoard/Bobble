<!-- @dsCard group="Foundations" height=300 subtitle="The glass pill that offers an action on what is selected" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip</title>
<style>
  body { margin: 0; background: var(--ground); }
  .sheet { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; padding: 32px; align-items: start; }
  .sheet figure { margin: 0; }
  .k { margin: 12px 2px 0; color: var(--ink-muted); }
  .k b { color: var(--ink-secondary); font-weight: 500; }
  .doc { height: 176px; }
  .doc .bb-lines + .bb-lines { margin-top: 18px; }
  .doc .bb-chip { position: absolute; left: 112px; top: 118px; }
  .stack { display: grid; gap: 14px; justify-items: start; padding-top: 6px; }
</style>
</head>
<body>
<div class="sheet">
  <figure class="bb-scene bb-hue-teal">
    <div class="bb-frame doc">
      <div class="bb-lines"><i class="bb-line" style="--w:90%"></i><i class="bb-line" style="--w:76%"></i></div>
      <div class="bb-lines bb-selected"><i class="bb-line"></i><i class="bb-line" style="--w:94%"></i><i class="bb-line" style="--w:58%"></i></div>
      <span class="bb-chip"><svg class="bb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2141 5.98239L16.6158 4.58063C17.39 3.80646 18.6452 3.80646 19.4194 4.58063C20.1935 5.3548 20.1935 6.60998 19.4194 7.38415L18.0176 8.78591M15.2141 5.98239L6.98023 14.2163C5.93493 15.2616 5.41226 15.7842 5.05637 16.4211C4.70047 17.058 4.3424 18.5619 4 20C5.43809 19.6576 6.94199 19.2995 7.57889 18.9436C8.21579 18.5877 8.73844 18.0651 9.78375 17.0198L18.0176 8.78591M15.2141 5.98239L18.0176 8.78591" stroke-linecap="round" stroke-linejoin="round"></path><path d="M11 20H17" stroke-linecap="round"></path></svg>Edit with Bobble</span>
    </div>
    <figcaption class="caption k"><b>On a selection</b>: below it, never over it</figcaption>
  </figure>
  <figure class="bb-scene bb-hue-teal">
    <div class="stack">
      <span class="bb-chip"><svg class="bb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2141 5.98239L16.6158 4.58063C17.39 3.80646 18.6452 3.80646 19.4194 4.58063C20.1935 5.3548 20.1935 6.60998 19.4194 7.38415L18.0176 8.78591M15.2141 5.98239L6.98023 14.2163C5.93493 15.2616 5.41226 15.7842 5.05637 16.4211C4.70047 17.058 4.3424 18.5619 4 20C5.43809 19.6576 6.94199 19.2995 7.57889 18.9436C8.21579 18.5877 8.73844 18.0651 9.78375 17.0198L18.0176 8.78591M15.2141 5.98239L18.0176 8.78591" stroke-linecap="round" stroke-linejoin="round"></path><path d="M11 20H17" stroke-linecap="round"></path></svg>Edit with Bobble</span>
      <span class="bb-chip"><svg class="bb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14L8.5 17.5L19 6.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>Added to Calendar</span>
    </div>
    <figcaption class="caption k"><b>Two jobs</b>: offer an action, confirm it was done. What the agent is doing now is its cursor's pill, not a chip.</figcaption>
  </figure>
</div>
</body>
</html>
