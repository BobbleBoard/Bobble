<!-- @dsCard group="In the app" height=800 width=1280 subtitle="A pop-out rising from the composer's +: the notch points down at it" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pop-out: Connectors</title>
<style>
  body { margin: 0; background: var(--ground); }
  /* the real window, photographed headless (tests/e2e/design-moments-probe.mjs), 2x */
  .screen { position: relative; width: 1280px; height: 800px; overflow: hidden;
    background: url(/_blob/d30e7f12ca5923df0f0b577d880b3fd1) 0 0 / 1280px 800px no-repeat; }
  [data-theme="dark"] .screen { background-image: url(/_blob/f4b115d2463b2d024dc62b9553272c83); }
  .tip { left: 420px; top: 106px; --notch: 30px; transform-origin: 30px calc(100% + 6px); }
  .bb-cursor.you { left: 452px; top: 403px; }
  /* the + menu, small: two connectors with their own marks and switches */
  .menu { width: 214px; padding: 5px; border-radius: 10px; background: var(--overlay); box-shadow: 0 0 0 1px var(--edge), var(--shadow-popover); font: 400 12px/16px var(--font-ui); color: var(--ink); position: relative; }
  .mrow { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 7px; border-radius: 6px; }
  .mrow.plain { color: var(--ink-secondary); }
  .mrule { height: 1px; margin: 4px 6px; background: var(--hairline); }
  .mmark { width: 14px; height: 14px; display: grid; place-items: center; color: var(--ink-muted); }
  .mmark svg { width: 14px; height: 14px; }
  .mname { flex: 1; }
  .sw { width: 26px; height: 16px; border-radius: 8px; background: var(--line-strong); position: relative; }
  .sw i { position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); }
  .sw.on { background: var(--accent); }
  .sw.on i { transform: translateX(10px); }
  .flip .sw { background: var(--accent); }
  .flip .sw i { transform: translateX(10px); }
  .mini-you { position: absolute; left: 191px; top: 55px; transform: scale(0.82); transform-origin: 1.53px 0.92px; }
  .loop .flip .sw { animation: sw 4800ms var(--ease-standard) infinite; }
  .loop .flip .sw i { animation: knob 4800ms var(--ease-press) infinite; }
  .loop .mini-you { animation: mini 4800ms linear infinite; }
  @keyframes sw { 0%, 46% { background: var(--line-strong); } 50%, 92% { background: var(--accent); } 96%, 100% { background: var(--line-strong); } }
  @keyframes knob { 0%, 46% { transform: none; } 50%, 92% { transform: translateX(10px); } 96%, 100% { transform: none; } }
  @keyframes mini {
    0%, 14% { transform: translate(40px, 34px) scale(0.82); opacity: 0; }
    18%, 30% { transform: translate(40px, 34px) scale(0.82); opacity: 1; animation-timing-function: var(--ease-glide); }
    36.25%, 44% { transform: scale(0.82); animation-timing-function: ease-in-out; }
    45.5% { transform: scale(0.64); animation-timing-function: ease-in-out; }
    47%, 88% { transform: scale(0.82); opacity: 1; }
    94%, 100% { transform: scale(0.82); opacity: 0; }
  }
  .loop .tip { animation: tip 6000ms var(--ease-settle) infinite; }
  .loop .you { animation: you 6000ms linear infinite; }
  @keyframes tip { 0%, 9% { opacity: 0; transform: scale(0.94); } 13%, 86% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: scale(0.97); } }
  @keyframes you {
    0% { transform: translate(260px, 170px); opacity: 0; }
    2%, 3% { transform: translate(260px, 170px); opacity: 1; animation-timing-function: var(--ease-glide); }
    8%, 76% { transform: none; animation-timing-function: var(--ease-glide); }
    81%, 82% { transform: translate(219px, -55px); animation-timing-function: ease-in-out; }
    83.2% { transform: translate(219px, -55px) scale(0.78); animation-timing-function: ease-in-out; }
    84.5%, 96% { transform: translate(219px, -55px); opacity: 1; }
    100% { transform: translate(219px, -55px); opacity: 0; }
  }

</style>
</head>
