<!-- @dsCard group="Demos" height=440 subtitle="Select, ask, rewritten: the verb is edit" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit</title>
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; place-items: center; padding: 40px 24px; }
  .doc { width: 320px; height: 352px; overflow: visible; }
  .doc .bb-title { margin-bottom: 20px; }
  .swap { display: grid; }
  .swap > .bb-lines { grid-area: 1 / 1; margin: 0; }
  .loop { --loop: 4800ms; }
  /* the static styles are the key frame: selected, asked, about to be done */
  .sel { position: relative; z-index: 0; }
  .sel .bb-line { position: relative; }
  .sel .bb-line::before {
    content: ''; position: absolute; inset: -4px -5px; border-radius: 4px;
    background: color-mix(in srgb, var(--hue) 22%, transparent);
    transform-origin: left center; z-index: -1;
    animation: sel var(--loop) var(--ease-settle) infinite backwards; animation-delay: calc(var(--i) * 110ms);
  }
  .sel .bb-line { background: var(--line-strong); }
  .old { animation: old var(--loop) var(--ease-standard) infinite; }
  .new { opacity: 0; animation: new var(--loop) var(--ease-standard) infinite; }
  .new .bb-line { transform-origin: left center; animation: grow var(--loop) var(--ease-settle) infinite backwards, fresh var(--loop) var(--ease-standard) infinite backwards; animation-delay: calc(var(--i) * 90ms); }
  .chip { position: absolute; left: 132px; top: 200px; animation: chip var(--loop) var(--ease-bob) infinite; }
  /* yours: the cursor without the agent's glow, gliding on ease-glide, pressing with a squeeze */
  .bb-cursor { left: 204px; top: 222px; animation: point var(--loop) linear infinite; }

  @keyframes sel { 0%, 8% { transform: scaleX(0); opacity: 1; } 22%, 58% { transform: scaleX(1); opacity: 1; } 64%, 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes old { 0%, 60% { opacity: 1; } 64%, 95% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes new { 0%, 60% { opacity: 0; } 62%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
  @keyframes grow { 0%, 61% { transform: scaleX(0); } 74%, 100% { transform: scaleX(1); } }
  /* a rewritten line arrives in the hue and settles to ink: new, then just text */
  @keyframes fresh { 0%, 62% { background: var(--hue); } 82%, 100% { background: var(--line); } }
  @keyframes chip {
    0%, 26% { opacity: 0; transform: translateY(6px) scale(0.7); }
    34%, 56% { opacity: 1; transform: none; }
    62%, 100% { opacity: 0; transform: translateY(-4px) scale(0.96); }
  }
  @keyframes point {
    0%, 28% { opacity: 0; transform: translate(70px, 110px); }
    32%, 41.75% { opacity: 1; transform: translate(70px, 110px); animation-timing-function: var(--ease-glide); }
    48%, 49% { transform: none; animation-timing-function: ease-in-out; }
    50.4% { transform: scale(0.78); animation-timing-function: ease-in-out; }
    52.1%, 70% { opacity: 1; transform: none; }
    80%, 100% { opacity: 0; transform: translate(40px, 60px); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bb-scene bb-hue-teal loop">
    <div class="bb-frame doc">
      <h3 class="bb-title">Launch plan</h3>
      <div class="bb-lines"><i class="bb-line" style="--w:94%"></i><i class="bb-line"></i><i class="bb-line" style="--w:88%"></i><i class="bb-line" style="--w:46%"></i></div>
      <div class="swap" style="margin-top:20px">
        <div class="bb-lines sel old"><i class="bb-line" style="--w:100%;--i:0"></i><i class="bb-line" style="--w:92%;--i:1"></i><i class="bb-line" style="--w:64%;--i:2"></i></div>
        <div class="bb-lines new"><i class="bb-line" style="--w:86%;--i:0"></i><i class="bb-line" style="--w:100%;--i:1"></i><i class="bb-line" style="--w:72%;--i:2"></i></div>
      </div>
      <div class="bb-lines" style="margin-top:20px"><i class="bb-line" style="--w:90%"></i><i class="bb-line" style="--w:97%"></i><i class="bb-line" style="--w:58%"></i></div>
      <span class="bb-chip chip">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 2.3 13.7 5.4 6.2 12.9 3.1 9.8z"/><path d="M8.9 4 12 7.1"/><path d="M3.1 9.8 2.1 13.9l4.1-1z"/></svg>
        Edit with Bobble
      </span>
      <span class="bb-cursor"><svg width="22.14" height="25.30" viewBox="49.499 49.514 191.719 219.132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><filter id="pi-cur-shadow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27.72"/></filter></defs><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="rgba(13, 15, 33, 0.3)" transform="translate(0 12.13)" filter="url(#pi-cur-shadow)"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="#0a0b0f" stroke="#ffffff" stroke-width="13.79" stroke-linejoin="round"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="none" stroke="#ffffff" stroke-width="4.69" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>
