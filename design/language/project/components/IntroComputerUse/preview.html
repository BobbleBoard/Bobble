<!-- @dsCard group="In the app" height=800 width=1280 subtitle="Centre screen, the first time Bobble asks to use an app: the demo on top, Got it bottom right" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro: computer use</title>
<style>
  body { margin: 0; background: var(--ground); }
  /* the real window, photographed headless (tests/e2e/design-moments-probe.mjs), 2x */
  .screen { position: relative; width: 1280px; height: 800px; overflow: hidden;
    background: url(/_blob/3e6c23d1ff18a350da60ea8e6eb57ddd) 0 0 / 1280px 800px no-repeat; }
  [data-theme="dark"] .screen { background-image: url(/_blob/2bfe60725a1c10215c56a908049510f5); }
  .mini { transform: scale(0.62); }

  .loop { --loop: 4800ms; }
  .app { width: 380px; overflow: visible; }
  .app .bb-window__body { position: relative; padding: 24px 24px 28px; }
  .app .bb-title { margin-bottom: 18px; }
  .label { width: 64px; height: 7px; border-radius: 4px; background: var(--line); margin: 0 0 8px; }
  .field { position: relative; height: 34px; border-radius: var(--radius-md); background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--hairline); margin-bottom: 16px; display: flex; align-items: center; padding: 0 12px; }
  .loop .field.focus { animation: focus var(--loop) var(--ease-standard) infinite; }
  .typed { display: flex; align-items: center; gap: 2px; }
  /* width, not scale: the caret has to ride the end of what has been typed */
  .typed .bb-line { width: 132px; height: 7px; background: var(--ink); opacity: 0.55; }
  .loop .typed .bb-line { animation: type var(--loop) steps(9, end) infinite; }
  .typed .bb-caret { height: 16px; opacity: 0; animation: none; }
  .loop .typed .bb-caret { animation: caret var(--loop) linear infinite; }
  .btn { position: relative; width: 108px; height: 34px; border-radius: var(--radius-md); background: var(--ink); display: grid; place-items: center; margin-top: 6px; }
  .btn i { width: 48px; height: 6px; border-radius: 3px; background: var(--surface); opacity: 0; }
  .loop .btn i { animation: btn-word var(--loop) var(--ease-standard) infinite; }
  .btn svg { position: absolute; width: 18px; height: 18px; }
  .loop .btn svg { animation: btn-done var(--loop) var(--ease-bob) infinite; }
  .btn svg path { fill: none; stroke: var(--surface); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* the tip rests on the button; every other place is a translate from there */
  .bb-cursor { left: 92px; top: 214px; }
  .loop .bb-cursor { animation: travel var(--loop) linear infinite; }
  .bb-status { opacity: 0; }
  .loop .s-type { animation: s-type var(--loop) var(--ease-standard) infinite; }
  .loop .s-click { animation: s-click var(--loop) var(--ease-standard) infinite; }

  /* glides are duration-travel (6.25% of the loop) on ease-glide; a press is a
     150ms squeeze to 0.78 about the tip, as agent-cursor.ts has it */
  @keyframes travel {
    0% { transform: translate(226px, 30px); opacity: 0; }
    4%, 8% { transform: translate(226px, 30px); opacity: 1; animation-timing-function: var(--ease-glide); }
    14.25%, 15% { transform: translate(206px, -116px); animation-timing-function: ease-in-out; }
    16.4% { transform: translate(206px, -116px) scale(0.78); animation-timing-function: ease-in-out; }
    18.1%, 54% { transform: translate(206px, -116px); animation-timing-function: var(--ease-glide); }
    60.25%, 61% { transform: none; animation-timing-function: ease-in-out; }
    62.4% { transform: scale(0.78); animation-timing-function: ease-in-out; }
    64.1%, 92% { transform: none; opacity: 1; }
    100% { transform: none; opacity: 0; }
  }
  @keyframes focus { 0%, 17% { box-shadow: inset 0 0 0 1px var(--hairline), 0 0 0 0 var(--hue); } 19%, 62% { box-shadow: inset 0 0 0 1px var(--hairline), 0 0 0 2px var(--hue); } 66%, 100% { box-shadow: inset 0 0 0 1px var(--hairline), 0 0 0 0 var(--hue); } }
  @keyframes type { 0%, 20% { width: 0; } 46%, 95% { width: 132px; } 100% { width: 0; } }
  @keyframes caret { 0%, 18% { opacity: 0; } 19%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
  @keyframes s-type { 0%, 18% { opacity: 0; } 20%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @keyframes s-click { 0%, 60% { opacity: 0; } 61.5%, 70% { opacity: 1; } 73%, 100% { opacity: 0; } }
  @keyframes btn-word { 0%, 63.5% { opacity: 0.85; } 65%, 95% { opacity: 0; } 100% { opacity: 0.85; } }
  @keyframes btn-done { 0%, 64% { opacity: 0; transform: scale(0.4); } 69%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(0.6); } }

</style>
</head>
<body>
<div class="screen bb-scene">
  <div class="bb-scrim">
    <div class="bb-intro bb-hue-teal" role="dialog" aria-label="Bobble can use your apps">
      <div class="bb-intro__stage">
        <div class="mini loop">
          <div class="bb-frame bb-window app">
      <div class="bb-window__bar"><i></i><i></i><i></i></div>
      <div class="bb-window__body">
        <h3 class="bb-title bb-title--s">Book a table</h3>
        <p class="label"></p>
        <div class="field focus"><span class="typed"><i class="bb-line"></i><i class="bb-caret"></i></span></div>
        <p class="label" style="width:44px"></p>
        <div class="field"></div>
        <div class="btn"><i></i><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg></div>
        <span class="bb-cursor"><svg width="22.14" height="25.30" viewBox="49.499 49.514 191.719 219.132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><filter id="pi-cur-glow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="68.95"/></filter><filter id="pi-cur-shadow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27.72"/></filter></defs><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="rgba(13, 15, 33, 0.3)" transform="translate(0 12.13)" filter="url(#pi-cur-shadow)"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="#2769ef" stroke="#2769ef" stroke-width="15.17" stroke-linejoin="round" opacity="0.36" filter="url(#pi-cur-glow)"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="#0a0b0f" stroke="#ffffff" stroke-width="13.79" stroke-linejoin="round"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="none" stroke="#ffffff" stroke-width="4.69" stroke-linejoin="round"/></svg><span class="bb-status s-type">Typing</span><span class="bb-status s-click">Clicking</span></span>
      </div>
    </div>
        </div>
      </div>
      <div class="bb-intro__body">
        <p class="bb-eyebrow">Computer use</p>
        <h2 class="bb-title bb-title--s">Bobble can use your apps</h2>
        <p class="bb-intro__text">It works in the background with its own cursor, so yours stays free. You choose which apps it can open.</p>
      </div>
      <div class="bb-intro__foot">
        <span class="bb-btn bb-btn--quiet">Choose apps</span>
        <span class="bb-btn bb-btn--primary">Got it</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
