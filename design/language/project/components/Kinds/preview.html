<!-- @dsCard group="Scenes" height=380 width=1200 subtitle="One subject, four kinds, each in its hue" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinds</title>
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: flex; align-items: flex-end; justify-content: center; gap: 32px; padding: 44px 32px 28px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  .doc, .design, .sheet { width: 216px; height: 272px; }
  .deck { width: 332px; height: 196px; }
  .deck { display: grid; grid-template-columns: 1fr 116px; gap: 20px; }
  .deck .bb-bars { --chart-h: 96px; align-self: end; gap: 10px; }
  .design .bb-picture { margin: -12px -12px 16px; }
  .design .btn { width: 92px; height: 30px; border-radius: var(--radius-full); background: var(--ink); display: grid; place-items: center; margin-top: 18px; }
  .design .btn i { width: 46px; height: 5px; border-radius: 3px; background: var(--surface); opacity: 0.85; }
  .sheet .bb-cells { --cols: 4; --cell: 38px; --gap: 4px; margin-top: 20px; }
  .sheet .bb-cell { height: 18px; }
  .sheet .col { background: var(--hue-tint); }
  .sheet .head { background: var(--line-strong); height: 14px; }
  .sheet .pick { box-shadow: inset 0 0 0 2px var(--hue); background: var(--surface); }
  .bb-frame .bb-title + .bb-lines { margin-top: 18px; }
</style>
</head>
<body>
<div class="stage">
  <figure class="bb-scene bb-hue-teal">
    <div class="bb-frame doc">
      <h3 class="bb-title">Launch plan</h3>
      <div class="bb-lines"><i class="bb-line" style="--w:92%"></i><i class="bb-line"></i><i class="bb-line" style="--w:84%"></i><i class="bb-line" style="--w:52%"></i></div>
      <div class="bb-lines"><i class="bb-line"></i><i class="bb-line" style="--w:90%"></i><i class="bb-line" style="--w:96%"></i><i class="bb-line" style="--w:38%"></i></div>
    </div>
    <figcaption class="bb-caption">Doc</figcaption>
  </figure>
  <figure class="bb-scene bb-hue-sun">
    <div class="bb-frame deck">
      <div>
        <h3 class="bb-title">Launch plan</h3>
        <div class="bb-lines" style="margin-top:18px"><i class="bb-line" style="--w:94%"></i><i class="bb-line" style="--w:78%"></i><i class="bb-line" style="--w:86%"></i><i class="bb-line" style="--w:54%"></i></div>
      </div>
      <div class="bb-bars"><i class="bb-bar" style="--h:44%"></i><i class="bb-bar" style="--h:92%"></i><i class="bb-bar" style="--h:66%"></i></div>
    </div>
    <figcaption class="bb-caption">Deck</figcaption>
  </figure>
  <figure class="bb-scene bb-hue-teal">
    <div class="bb-frame sheet">
      <h3 class="bb-title">Launch plan</h3>
      <div class="bb-cells">
        <i class="bb-cell bb-cell--sheet head"></i><i class="bb-cell bb-cell--sheet head"></i><i class="bb-cell bb-cell--sheet head"></i><i class="bb-cell bb-cell--sheet head"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col pick"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
        <i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet col"></i><i class="bb-cell bb-cell--sheet"></i><i class="bb-cell bb-cell--sheet"></i>
      </div>
    </div>
    <figcaption class="bb-caption">Sheet</figcaption>
  </figure>
  <figure class="bb-scene bb-hue-sun">
    <div class="bb-frame design">
      <span class="bb-picture" aria-hidden="true">
        <svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMax slice">
          <circle class="sun" cx="120" cy="30" r="13"/>
          <rect class="hill-back" x="70" y="52" width="70" height="70" rx="19.6" transform="rotate(45 105 87)"/>
          <rect class="hill" x="12" y="48" width="78" height="78" rx="21.8" transform="rotate(45 51 87)"/>
        </svg>
      </span>
      <h3 class="bb-title bb-title--s">Launch plan</h3>
      <div class="bb-lines" style="margin-top:12px"><i class="bb-line" style="--w:88%"></i><i class="bb-line" style="--w:64%"></i></div>
      <span class="btn"><i></i></span>
    </div>
    <figcaption class="bb-caption">Design</figcaption>
  </figure>
</div>
</body>
</html>
