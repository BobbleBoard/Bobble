<!-- @dsCard group="In the app" height=800 width=1280 subtitle="A pop-out from the 3D Studio rail: the notch points at Segment, the demo above, Got it below" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pop-out: Segment</title>
<style>
  body { margin: 0; background: var(--ground); }
  /* the real window, photographed headless (tests/e2e/design-moments-probe.mjs), 2x */
  .screen { position: relative; width: 1280px; height: 800px; overflow: hidden;
    background: url(/_blob/4a3ff0f685b39ba0ec54c5a226732436) 0 0 / 1280px 800px no-repeat; }
  [data-theme="dark"] .screen { background-image: url(/_blob/5117f118d617706abe97d5e9ed8f2eae); }
  .hover { position: absolute; left: 289px; top: 168px; width: 64px; height: 50px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .tip { left: 366px; top: 150px; --notch: 42px; transform-origin: -6px 42px; }
  .tip .bb-popout__stage svg.lamp { width: 168px; height: 137px; margin: 0; }
  .tip .tag { display: none; }
  .bb-cursor.you { left: 336px; top: 184px; }
  /* the pointer arrives, the card opens out of the notch, Got it closes it */
  .loop .tip { animation: tip 6000ms var(--ease-settle) infinite; }
  .loop .hover { animation: hover 6000ms var(--ease-standard) infinite; }
  .loop .you { animation: you 6000ms linear infinite; }
  @keyframes tip { 0%, 9% { opacity: 0; transform: scale(0.94); } 13%, 86% { opacity: 1; transform: none; } 90%, 100% { opacity: 0; transform: scale(0.97); } }
  @keyframes hover { 0%, 6% { opacity: 0; } 8%, 88% { opacity: 1; } 91%, 100% { opacity: 0; } }
  @keyframes you {
    0% { transform: translate(190px, 230px); opacity: 0; }
    2%, 3% { transform: translate(190px, 230px); opacity: 1; animation-timing-function: var(--ease-glide); }
    8%, 76% { transform: none; animation-timing-function: var(--ease-glide); }
    81%, 82% { transform: translate(281px, 208px); animation-timing-function: ease-in-out; }
    83.2% { transform: translate(281px, 208px) scale(0.78); animation-timing-function: ease-in-out; }
    84.5%, 96% { transform: translate(281px, 208px); opacity: 1; }
    100% { transform: translate(281px, 208px); opacity: 0; }
  }

  svg.lamp { display: block; width: 352px; height: 288px; margin: 0 auto; overflow: visible; }
  /* untinted, a part is the ink mixed into the surface; tinted, it is its hue */
  .lamp { --n-top: color-mix(in srgb, var(--ink) 7%, var(--surface)); --n-body: color-mix(in srgb, var(--ink) 15%, var(--surface)); --n-in: color-mix(in srgb, var(--ink) 30%, var(--surface)); }
  .ground { fill: rgba(0, 0, 0, 0.06); }
  [data-theme="dark"] .ground { fill: rgba(0, 0, 0, 0.32); }
  /* the light lies on the curved sides only; a flat top or an opening takes its own tone */
  .n .top { fill: var(--n-top); }
  .n .body { fill: var(--n-body); }
  .n .in { fill: var(--n-in); }
  .h .top { fill: color-mix(in srgb, var(--hue) 52%, #fff); }
  .h .body { fill: var(--hue); }
  .h .in { fill: color-mix(in srgb, var(--hue) 62%, #000); }
  .light { fill: url(#round); pointer-events: none; }
  .tag text { font: 500 12px/1 var(--font-ui); fill: var(--ink-secondary); }
  .tag rect { fill: var(--hue); }
  .tag line { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; }

  /* the result is the static frame: coloured, apart, named */
  .stem { transform: translateY(-32px); }
  .shade { transform: translateY(-64px); }
  .loop .h { animation: var(--tint) 4800ms var(--ease-standard) infinite; }
  .loop .base .h { --tint: tint-1; }
  .loop .stem .h { --tint: tint-2; }
  .loop .shade .h { --tint: tint-3; }
  .loop .stem { animation: lift-stem 4800ms var(--ease-settle) infinite; }
  .loop .shade { animation: lift-shade 4800ms var(--ease-settle) infinite; }
  .loop .tag { animation: tag 4800ms var(--ease-standard) infinite; }
  @keyframes tint-1 { 0%, 10% { opacity: 0; } 17%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
  @keyframes tint-2 { 0%, 16% { opacity: 0; } 23%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
  @keyframes tint-3 { 0%, 22% { opacity: 0; } 29%, 86% { opacity: 1; } 94%, 100% { opacity: 0; } }
  @keyframes lift-stem { 0%, 38% { transform: none; } 52%, 80% { transform: translateY(-32px); } 92%, 100% { transform: none; } }
  @keyframes lift-shade { 0%, 34% { transform: none; } 50%, 80% { transform: translateY(-64px); } 92%, 100% { transform: none; } }
  @keyframes tag { 0%, 50% { opacity: 0; transform: translateX(-6px); } 57%, 77% { opacity: 1; transform: none; } 82%, 100% { opacity: 0; transform: none; } }

</style>
</head>
<body>
<div class="screen bb-scene loop">
  <span class="hover" aria-hidden="true"></span>
  <div class="bb-popout bb-popout--left tip bb-hue-sun" role="dialog" aria-label="Segment">
    <div class="bb-popout__stage">
      <svg class="lamp loop" viewBox="0 0 352 288" aria-hidden="true">
        <defs>
          <!-- one light from the upper left, laid over every curved face -->
          <linearGradient id="round" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
            <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
          </linearGradient>
        </defs>
        <ellipse class="ground" cx="140" cy="262" rx="78" ry="20"/>

        <g class="part base bb-hue-teal">
          <g class="n"><path class="body" d="M80 236V250A60 18 0 0 0 200 250V236Z"/></g>
          <g class="h"><path class="body" d="M80 236V250A60 18 0 0 0 200 250V236Z"/></g>
          <path class="light" d="M80 236V250A60 18 0 0 0 200 250V236Z"/>
          <g class="n"><ellipse class="top" cx="140" cy="236" rx="60" ry="18"/></g>
          <g class="h"><ellipse class="top" cx="140" cy="236" rx="60" ry="18"/></g>
          <g class="tag"><line x1="208" y1="243" x2="236" y2="243"/><rect x="244" y="239" width="8" height="8" rx="2.24"/><text x="258" y="247">Base</text></g>
        </g>

        <g class="part stem bb-hue-sun">
          <g class="n"><path class="body" d="M133 146V236A7 2.2 0 0 0 147 236V146Z"/></g>
          <g class="h"><path class="body" d="M133 146V236A7 2.2 0 0 0 147 236V146Z"/></g>
          <path class="light" d="M133 146V236A7 2.2 0 0 0 147 236V146Z"/>
          <g class="tag"><line x1="154" y1="200" x2="236" y2="200"/><rect x="244" y="196" width="8" height="8" rx="2.24"/><text x="258" y="204">Stem</text></g>
        </g>

        <g class="part shade bb-hue-pink">
          <g class="n"><path class="body" d="M110 102L78 164A62 18.6 0 0 0 202 164L170 102Z"/></g>
          <g class="h"><path class="body" d="M110 102L78 164A62 18.6 0 0 0 202 164L170 102Z"/></g>
          <path class="light" d="M110 102L78 164A62 18.6 0 0 0 202 164L170 102Z"/>
          <g class="n"><ellipse class="in" cx="140" cy="102" rx="30" ry="9"/></g>
          <g class="h"><ellipse class="in" cx="140" cy="102" rx="30" ry="9"/></g>
          <g class="tag"><line x1="206" y1="138" x2="236" y2="138"/><rect x="244" y="134" width="8" height="8" rx="2.24"/><text x="258" y="142">Shade</text></g>
        </g>
      </svg>
    </div>
    <div class="bb-popout__body">
      <p class="bb-popout__title">Segment</p>
      <p class="bb-popout__text">Split a model into its parts, then colour, move or export each one on its own.</p>
    </div>
    <div class="bb-popout__foot"><span class="bb-btn bb-btn--primary bb-btn--s">Got it</span></div>
  </div>
  <span class="bb-cursor you"><svg width="22.14" height="25.30" viewBox="49.499 49.514 191.719 219.132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><filter id="pi-cur-shadow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="27.72"/></filter></defs><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="rgba(13, 15, 33, 0.3)" transform="translate(0 12.13)" filter="url(#pi-cur-shadow)"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="#0a0b0f" stroke="#ffffff" stroke-width="13.79" stroke-linejoin="round"/><path d="M 58.48 87.06 A 24.06 25.11 -36 0 1 93.89 61.34 L 223.67 137.27 A 18.23 19.02 -36 0 1 218.85 171.89 A 117.23 122.31 -36 0 0 131.29 247.95 A 19.66 20.51 -36 0 1 92.88 244.4 Z" fill="none" stroke="#ffffff" stroke-width="4.69" stroke-linejoin="round"/></svg></span>
</div>
</body>
</html>
